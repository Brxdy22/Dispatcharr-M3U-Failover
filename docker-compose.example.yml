services:
  m3u-failover:
    image: python:3.12-alpine
    container_name: m3u-failover
    # Must share a network with Dispatcharr, because the proxy listens on 127.0.0.1.
    # Use "service:gluetun" if Dispatcharr runs through Gluetun, or
    # "container:dispatcharr" if it doesn't.
    network_mode: "service:gluetun"
    restart: unless-stopped
    command: ["python", "-u", "/app/failover.py"]
    environment:
      - TZ=UTC                   # the nightly sort runs in this time zone
      - CONFIG=/config/upstreams.conf
      - CONNECT_TIMEOUT=4        # seconds to connect before trying the next URL
      - HEADER_TIMEOUT=15        # seconds to wait for headers before trying the next URL
      - SORT_AT=03:00            # "off" disables the nightly sort
    volumes:
      - ./failover.py:/app/failover.py:ro
      - .:/config                # writable: the nightly sort rewrites upstreams.conf
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "1000:1000"            # must be able to write to this folder
